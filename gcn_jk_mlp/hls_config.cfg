# ============================================================================
#  Vitis 2025.1 component config -- GCN + JumpingKnowledge + pragma MLPs
#
#  csim only for now. The part and clock below matter for csynth, not csim;
#  they are the Alveo U250 settings used elsewhere in this project. Her
#  solution1/script.tcl targeted xcvu13p_CIV-figd2104-3-e under 2022.1 --
#  swap `part` back to that if you want to reproduce her synthesis numbers.
#
#  INI format: comments are '#', NOT '//'. A '//' comment here makes
#  vitis-run fail with "failed with a parsing error".
# ============================================================================
part=xcu250-figd2104-2L-e

[hls]
flow_target=vitis
package.output.format=ip_catalog
package.output.syn=false
syn.top=HMoE_GCN_JK_PragmaMLP_top
syn.file=/home/rizwanpathan/gcn_jk_mlp/model.cpp
syn.file=/home/rizwanpathan/gcn_jk_mlp/pragma_mlp.cpp
tb.file=/home/rizwanpathan/gcn_jk_mlp/model_tb.cpp
tb.file=/home/rizwanpathan/gcn_jk_mlp/tb_data
clock=3.33ns
